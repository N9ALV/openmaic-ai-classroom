name: Pilot acceptance (no live providers)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [production-pilot]

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level=high
      - name: Launcher contracts
        run: node --test scripts/test-start-local.mjs
      - name: Learning and security contracts
        run: pnpm exec vitest run tests/home tests/server/access-token.test.ts tests/server/health-route.test.ts tests/server/pilot-request-boundary.test.ts tests/server/investment-research-receipt.test.ts tests/video-export/chunk-worker-exit.test.ts --maxWorkers=2 --testTimeout=30000
      - run: pnpm --filter @openmaic/renderer test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: node scripts/prepare-standalone.mjs
      - run: pnpm exec playwright test --config=playwright.pilot.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pilot-browser-failures
          path: test-results/
          retention-days: 7
