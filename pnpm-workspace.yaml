packages:
  - "packages/*"
  - "packages/@openmaic/*"
  - "!packages/docs" # standalone docs sub-app: own lockfile, build, deploy

# Patch-compatible security floors. Keep ranges scoped to the affected major.
overrides:
  "form-data@>=2 <3": "2.5.6"
  "@xmldom/xmldom@>=0.8 <0.9": "0.8.15"
  "postcss@>=8 <9": "8.5.28"
  "js-yaml@>=4 <5": "4.3.2"
  "form-data@>=4 <5": "4.0.6"
  "echarts@>=6 <7": "6.1.0"
  "nanoid@>=5 <6": "5.1.16"
  "ws@>=8 <9": "8.21.0"
  "protobufjs@>=7 <8": "7.6.5"
  "@babel/core@>=7 <8": "7.29.6"
  "browserslist@>=4 <5": "4.28.7"
  "baseline-browser-mapping@>=2 <3": "2.11.0"
  "mermaid@>=11 <12": "11.16.1"
  "dompurify@>=3 <4": "3.4.13"
  "@ai-sdk/provider-utils@>=4 <5": "4.0.33"
  "uuid@>=11 <12": "11.1.1"
  "uuid@>=13 <14": "13.0.1"
  "@langchain/core>langsmith": "0.6.3"
  "hono@>=4 <5": "4.13.8"
  "@hono/node-server@>=1 <2": "1.19.17"
  "path-to-regexp@>=8 <9": "8.4.0"
  "fast-uri@>=3 <4": "3.1.6"
  "ip-address@>=10 <11": "10.3.1"
  "qs@>=6 <7": "6.16.0"
  "body-parser@>=2 <3": "2.3.0"
  # The converter already receives a DOM document. Reuse its implementation
  # instead of loading get-dom's obsolete jsdom/network dependency chain.
  "omml2mathml>get-dom": "-"

patchedDependencies:
  "omml2mathml@1.3.0": patches/omml2mathml@1.3.0.patch
